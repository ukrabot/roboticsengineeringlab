<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Joint frames of a six-degree-of-freedom robot arm</title>
<desc>Schematic side view of a serial 6-DOF robot arm showing joints J1 through J6, link labels, coordinate axes at each joint, and a target tool pose.</desc>
<rect x="0" y="0" width="1600" height="900" fill="#0b0e14"/>
<g stroke="#1c2028" stroke-width="1">
<line x1="0" y1="150" x2="1600" y2="150"/>
<line x1="0" y1="300" x2="1600" y2="300"/>
<line x1="0" y1="450" x2="1600" y2="450"/>
<line x1="0" y1="600" x2="1600" y2="600"/>
<line x1="0" y1="750" x2="1600" y2="750"/>
<line x1="200" y1="0" x2="200" y2="900"/>
<line x1="500" y1="0" x2="500" y2="900"/>
<line x1="800" y1="0" x2="800" y2="900"/>
<line x1="1100" y1="0" x2="1100" y2="900"/>
<line x1="1400" y1="0" x2="1400" y2="900"/>
</g>

<rect x="140" y="770" width="120" height="24" rx="4" fill="#181b21" stroke="#c9a96e" stroke-width="1.5"/>
<text x="200" y="850" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="22">Base frame</text>
<text x="200" y="878" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="15">T0: X0, Y0, Z0</text>
<line x1="200" y1="770" x2="200" y2="700" stroke="#78a6e8" stroke-width="2"/>
<line x1="200" y1="700" x2="150" y2="740" stroke="#78a6e8" stroke-width="2"/>
<line x1="200" y1="700" x2="250" y2="740" stroke="#78a6e8" stroke-width="2"/>
<text x="200" y="690" text-anchor="middle" fill="#78a6e8" font-family="Inter,sans-serif" font-size="16">Z0</text>
<text x="140" y="750" text-anchor="middle" fill="#78a6e8" font-family="Inter,sans-serif" font-size="16">X0</text>
<text x="260" y="750" text-anchor="middle" fill="#78a6e8" font-family="Inter,sans-serif" font-size="16">Y0</text>

<line x1="200" y1="770" x2="200" y2="560" stroke="#3d4046" stroke-width="16" stroke-linecap="round"/>
<text x="222" y="670" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="16">Link 1</text>

<circle cx="200" cy="560" r="26" fill="#181b21" stroke="#c9a96e" stroke-width="2"/>
<circle cx="200" cy="560" r="8" fill="#c9a96e"/>
<text x="200" y="500" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="22">Joint 1</text>
<text x="200" y="524" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="15">Base rotation</text>
<path d="M 178 560 A 26 26 0 0 1 222 560" fill="none" stroke="#c9a96e" stroke-width="2"/>
<polygon points="222,560 214,551 214,569" fill="#c9a96e"/>
<text x="245" y="590" fill="#c9a96e" font-family="Inter,sans-serif" font-size="15">J1 axis (yaw)</text>

<line x1="200" y1="560" x2="480" y2="380" stroke="#3d4046" stroke-width="16" stroke-linecap="round"/>
<text x="300" y="450" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="16">Link 2</text>

<circle cx="500" cy="365" r="26" fill="#181b21" stroke="#c9a96e" stroke-width="2"/>
<circle cx="500" cy="365" r="8" fill="#c9a96e"/>
<text x="500" y="290" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="22">Joint 2</text>
<text x="500" y="314" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="15">Shoulder pivot</text>
<path d="M 478 365 A 26 26 0 0 1 522 365" fill="none" stroke="#c9a96e" stroke-width="2"/>
<polygon points="522,365 514,356 514,374" fill="#c9a96e"/>
<text x="545" y="395" fill="#c9a96e" font-family="Inter,sans-serif" font-size="15">J2 axis</text>

<line x1="500" y1="365" x2="800" y2="330" stroke="#3d4046" stroke-width="16" stroke-linecap="round"/>
<text x="600" y="320" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="16">Link 3</text>

<circle cx="820" cy="328" r="24" fill="#181b21" stroke="#c9a96e" stroke-width="2"/>
<circle cx="820" cy="328" r="7" fill="#c9a96e"/>
<text x="820" y="256" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="22">Joint 3</text>
<text x="820" y="280" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="15">Elbow pivot</text>
<path d="M 800 328 A 24 24 0 0 1 840 328" fill="none" stroke="#c9a96e" stroke-width="2"/>
<polygon points="840,328 832,320 832,336" fill="#c9a96e"/>
<text x="860" y="355" fill="#c9a96e" font-family="Inter,sans-serif" font-size="15">J3 axis</text>

<line x1="820" y1="328" x2="1080" y2="300" stroke="#3d4046" stroke-width="12" stroke-linecap="round"/>
<text x="900" y="290" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="16">Link 4 (forearm)</text>

<circle cx="1100" cy="298" r="20" fill="#181b21" stroke="#78a6e8" stroke-width="2"/>
<circle cx="1100" cy="298" r="6" fill="#78a6e8"/>
<text x="1100" y="235" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="20">Joint 4</text>
<text x="1100" y="257" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="14">Wrist pitch</text>

<circle cx="1160" cy="298" r="20" fill="#181b21" stroke="#78a6e8" stroke-width="2"/>
<circle cx="1160" cy="298" r="6" fill="#78a6e8"/>
<text x="1160" y="235" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="20">Joint 5</text>
<text x="1160" y="257" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="14">Wrist yaw</text>

<line x1="1100" y1="298" x2="1160" y2="298" stroke="#3d4046" stroke-width="10" stroke-linecap="round"/>

<circle cx="1230" cy="298" r="20" fill="#181b21" stroke="#78a6e8" stroke-width="2"/>
<circle cx="1230" cy="298" r="6" fill="#78a6e8"/>
<text x="1230" y="235" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="20">Joint 6</text>
<text x="1230" y="257" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="14">Tool roll</text>
<line x1="1160" y1="298" x2="1230" y2="298" stroke="#3d4046" stroke-width="10" stroke-linecap="round"/>

<line x1="1230" y1="298" x2="1290" y2="298" stroke="#3d4046" stroke-width="8" stroke-linecap="round"/>
<rect x="1290" y="284" width="30" height="28" rx="4" fill="#181b21" stroke="#c9a96e" stroke-width="1.5"/>
<text x="1305" y="345" text-anchor="middle" fill="#f2f0eb" font-family="Georgia,serif" font-size="18">Tool flange</text>
<text x="1305" y="368" text-anchor="middle" fill="#77736e" font-family="Inter,sans-serif" font-size="14">T6: X6, Y6, Z6</text>
<line x1="1305" y1="284" x2="1305" y2="250" stroke="#78a6e8" stroke-width="2"/>
<line x1="1305" y1="250" x2="1285" y2="264" stroke="#78a6e8" stroke-width="2"/>
<text x="1305" y="238" text-anchor="middle" fill="#78a6e8" font-family="Inter,sans-serif" font-size="14">Z6</text>

<rect x="1400" y="180" width="160" height="180" rx="6" fill="#181b21" stroke="#e4c07a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1480" y="165" text-anchor="middle" fill="#e4c07a" font-family="Inter,sans-serif" font-size="16" font-weight="600">Target pose</text>
<circle cx="1480" cy="240" r="6" fill="#e4c07a"/>
<text x="1480" y="222" text-anchor="middle" fill="#f2f0eb" font-family="Inter,sans-serif" font-size="14">TCP</text>
<line x1="1480" y1="240" x2="1480" y2="290" stroke="#e4c07a" stroke-width="1.5"/>
<text x="1480" y="308" text-anchor="middle" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="13">Roll</text>
<line x1="1480" y1="240" x2="1440" y2="290" stroke="#e4c07a" stroke-width="1.5"/>
<text x="1420" y="308" text-anchor="middle" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="13">Pitch</text>
<line x1="1480" y1="240" x2="1520" y2="290" stroke="#e4c07a" stroke-width="1.5"/>
<text x="1540" y="308" text-anchor="middle" fill="#b0ab9f" font-family="Inter,sans-serif" font-size="13">Yaw</text>

</svg>
